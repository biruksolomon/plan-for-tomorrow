name: plan_tomorrow
description: Plan tomorrow tonight, tick it off tomorrow.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Color.withValues and the current fl_chart tooltip API need Flutter 3.27+.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true